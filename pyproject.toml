[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph", "langchain", "langchain-core", "langchain-ollama", "pydantic", "pydantic-settings", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["ollama: requires a running local Ollama server"]
